name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # providerkit and the manifest linter come from the gateway until
      # providerkit is tagged on its own.
      - uses: actions/checkout@v4
        with:
          repository: mcplocker/server
          path: .gateway
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: go mod edit -replace github.com/mcplocker/server/pkg/providerkit=./.gateway/pkg/providerkit
      - run: make test
      - run: make lint GATEWAY=.gateway
      - run: make smoke
